apiVersion: v1
kind: Pod
metadata:
  name: trtllm-semantic-validation
  namespace: semblend-trtllm
  labels:
    app: semblend
    component: trtllm-semantic-validation
spec:
  restartPolicy: Never
  containers:
    - name: validation
      image: nvcr.io/nvidia/tensorrt-llm/release:1.2.1
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          nvidia-smi
          python3 - <<'PY'
          import sys
          import tensorrt_llm

          print("python", sys.version)
          print("tensorrt_llm", tensorrt_llm.__version__)
          PY
          sleep 86400
      env:
        - name: HF_HOME
          value: /cache/huggingface
        - name: TRANSFORMERS_CACHE
          value: /cache/huggingface
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 48Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: cache
          mountPath: /cache
        - name: workspace
          mountPath: /workspace
        - name: results
          mountPath: /results
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: cache
      emptyDir:
        sizeLimit: 80Gi
    - name: workspace
      emptyDir:
        sizeLimit: 20Gi
    - name: results
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  nodeSelector:
    eks.amazonaws.com/nodegroup: gpu-nodes-g5
    nvidia.com/gpu.product: NVIDIA-A10G
    nvidia.com/gpu.sharing-strategy: none
